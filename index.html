<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Music Label Homepage</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">

  <style>
    body { margin:0; font-family:'Segoe UI', sans-serif; color:#fff; }
    header { position:fixed; top:0; width:100%; background:rgba(0,0,0,0.6); padding:20px; z-index:100; }
    nav a { margin:0 15px; text-decoration:none; color:#fff; font-weight:bold; }
    .hero { height:100vh; background:url('main bg.png') no-repeat center center/cover;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            text-align:center; }
  .hero h1 {
  font-size: 72px;
  font-weight: 900;
  letter-spacing: 3px;
  background: linear-gradient(90deg, #ff6f61, #ff9a9e, #fad0c4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
  animation: glow 3s ease-in-out infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #ff6f61, 0 0 20px #ff9a9e; }
  to { text-shadow: 0 0 20px #fad0c4, 0 0 40px #ff6f61; }
}

    .hero p { font-size:20px; margin:10px 0; animation:fadeIn 3s ease; }
    .hero button { padding:15px 30px; font-size:18px; border:none; border-radius:30px;
                   background:#ff6f61; color:#fff; cursor:pointer; transition:0.3s; }
    .hero button:hover { background:#ff3b2e; transform:scale(1.05); }
    .section { padding:80px 40px; background:#111; }
    .artists { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; }
    .artist-card { background:rgba(255,255,255,0.1); border-radius:10px; width:200px;
                   padding:20px; text-align:center; transition:transform 0.3s, box-shadow 0.3s; }
    .artist-card:hover { transform:scale(1.1); box-shadow:0 0 20px #ff6f61; }
    footer { background:#000; padding:20px; text-align:center; }
    @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="#">Home</a>
      <a href="artist1.html">Artists</a>
      <a href="albums.html">Albums</a>
      <a href="videos.html">Videos</a>
      <a href="news.html">News</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <div class="hero">
    <h1>Music for a New Era</h1>
    <p>AI & Human Artists Together</p>
    <button onclick="location.href='artist1.html'">Explore Artists</button>
  </div>

  <div class="section">
    <h2 style="text-align:center;">Featured Artists</h2>
    <div class="artists">
      <div class="artist-card">
        <h3>AI Singer 1</h3>
        <p>City Pop Specialist</p>
        <a href="artist1.html" style="color:#ff6f61;">View Profile</a>
      </div>
      <div class="artist-card">
        <h3>Human Singer A</h3>
        <p>Emotional Ballads</p>
        <a href="artistA.html" style="color:#ff6f61;">View Profile</a>
      </div>
      <!-- 더 많은 아티스트 카드 추가 가능 -->
    </div>
  </div>

  <footer>
    <p>© 2026 Music Label. All rights reserved.</p>
  </footer>
</body>
</html>
